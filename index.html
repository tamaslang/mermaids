<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mermaids</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <main id="game">
    <canvas id="ocean" aria-hidden="true"></canvas>
    <section id="welcome" class="screen">
      <h1>Mermaids</h1>
      <p class="tagline">dive deep · swim far · find the pearls</p>
      <div class="stage">
        <img class="friend jelly" data-sprite="jellyking" alt="">
        <img class="queen" data-sprite="queen" alt="A mermaid">
        <img class="friend fish one" data-sprite="fish" alt="">
        <img class="friend fish two" data-sprite="fish" alt="">
        <img class="friend pearl left" data-sprite="pearl" alt="">
        <img class="friend pearl right" data-sprite="pearl" alt="">
      </div>
      <button id="start" type="button" disabled>Start Game</button>
      <p class="hint">arrows / WASD to swim</p>
    </section>
    <section id="playing" class="screen" hidden>
      <canvas id="game-canvas" aria-label="Game"></canvas>
    </section>
  </main>
</body>
</html>
